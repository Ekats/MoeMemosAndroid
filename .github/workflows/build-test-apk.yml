name: Build Test APK

# Debug APK installable next to the real app (package me.mudkip.moememos.test,
# named "MoeMemos Test"), for trying a branch on a phone. No signing secrets needed.
on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

jobs:
  build-test-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make the build a separate app
        run: |
          sed -i 's/applicationId = "me.mudkip.moememos"/applicationId = "me.mudkip.moememos.test"/' app/build.gradle
          sed -i 's/android:authorities="me.mudkip.moememos.fileprovider"/android:authorities="${applicationId}.fileprovider"/' app/src/main/AndroidManifest.xml
          find app/src/main/res -path '*/values*/strings.xml' -exec \
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">MoeMemos Test</string>|' {} +
          grep -n 'applicationId = ' app/build.gradle
          grep -n 'fileprovider' app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moememos-test-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

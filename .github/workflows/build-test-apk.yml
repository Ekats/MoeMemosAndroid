name: Build Test APK

# Release APK for trying a branch on a phone, signed with the committed test key in
# .github/test-signing so each test build installs as an update over the previous one.
# Published as the "test-build" pre-release, replaced on every push:
# https://github.com/<owner>/<repo>/releases/download/test-build/moememos-test.apk
on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  build-test-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK signed with the test key
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/.github/test-signing/test.keystore
          ANDROID_SIGNING_STORE_PASSWORD: moememos-test
          ANDROID_SIGNING_KEY_ALIAS: moememos-test
          ANDROID_SIGNING_KEY_PASSWORD: moememos-test
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk moememos-test.apk

      - name: Replace the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build moememos-test.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Test build (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Test build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Signed with the fork's public test key, not for distribution."
